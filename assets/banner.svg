<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 033</title>
  <desc>A vivid modern editorial-cover collage built from one recognisable flower motif, repeated scales, bold crop, flat source colour, print grain, and integrated typography.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <clipPath id="cover"><rect x="716" y="31" width="440" height="338" rx="18"/></clipPath>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="33" result="n"/><feComposite in="n" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="soft-light"/></filter>
    <g id="flower"><ellipse cx="0" cy="-31" rx="18" ry="36" fill="#F6C445"/><ellipse cx="29" cy="-10" rx="18" ry="36" transform="rotate(72 29 -10)" fill="#F6C445"/><ellipse cx="18" cy="26" rx="18" ry="36" transform="rotate(144 18 26)" fill="#F6C445"/><ellipse cx="-18" cy="26" rx="18" ry="36" transform="rotate(216 -18 26)" fill="#F6C445"/><ellipse cx="-29" cy="-10" rx="18" ry="36" transform="rotate(288 -29 -10)" fill="#F6C445"/><circle r="18" fill="#EE5B3F"/></g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F2EFE7"/>
    <g transform="translate(60 46)">
      <rect width="230" height="34" rx="7" fill="#172B36"/><text x="17" y="22" fill="#FFF7E9" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
      <text x="0" y="112" fill="#172B36" font-family="Georgia, serif" font-size="67" font-weight="700" letter-spacing="-3">PANEL <tspan fill="#EE5B3F">033</tspan></text>
      <text x="2" y="151" fill="#194E69" font-family="Arial, sans-serif" font-size="17" font-weight="900" letter-spacing=".5">MOTIF · SCALE · COLLAGE · COVER TYPE · PRINT</text>
      <text x="2" y="195" fill="#172B36" font-family="sans-serif" font-size="18" font-weight="800">可识别母题 · 层次拼贴 · 鲜明配色 · 封面排版</text>
      <text x="2" y="226" fill="#172B36" fill-opacity=".74" font-family="sans-serif" font-size="14" font-weight="700">編集カバー・コラージュ · 현대 에디토리얼 표지</text>
      <text x="2" y="257" fill="#172B36" fill-opacity=".74" font-family="Arial, sans-serif" font-size="14" font-weight="700">كولاج غلاف تحريري حديث متعدد الطبقات</text>
    </g>
    <g transform="translate(60 326)">
      <rect width="120" height="38" rx="7" fill="#194E69"/><text x="60" y="25" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="12" font-weight="900">ONE MOTIF</text>
      <rect x="132" width="134" height="38" rx="7" fill="#EE5B3F"/><text x="199" y="25" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="12" font-weight="900">PRINT LAYERS</text>
      <rect x="278" width="105" height="38" rx="7" fill="#F6C445"/><text x="330.5" y="25" text-anchor="middle" fill="#172B36" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
      <rect x="395" width="177" height="38" rx="7" fill="#9BBDB6"/><text x="483.5" y="25" text-anchor="middle" fill="#172B36" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
    </g>
    <g clip-path="url(#cover)" filter="url(#grain)">
      <rect x="716" y="31" width="440" height="338" rx="18" fill="#194E69"/>
      <rect x="716" y="31" width="135" height="338" fill="#EE5B3F"/>
      <g opacity=".42"><use href="#flower" transform="translate(760 70) scale(.42)"/><use href="#flower" transform="translate(760 126) scale(.42)"/><use href="#flower" transform="translate(760 182) scale(.42)"/><use href="#flower" transform="translate(760 238) scale(.42)"/><use href="#flower" transform="translate(760 294) scale(.42)"/><use href="#flower" transform="translate(760 350) scale(.42)"/></g>
      <use href="#flower" transform="translate(1008 220) scale(2.25) rotate(-13)"/>
      <circle cx="1112" cy="85" r="25" fill="#9BBDB6"/>
      <text x="744" y="104" fill="#FFF6E6" font-family="Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="2">FRESH / 033</text>
      <text x="811" y="178" fill="#FFF6E6" font-family="Arial, sans-serif" font-size="87" font-weight="900" letter-spacing="-7">BLOOM</text>
      <text x="811" y="210" fill="#FFF6E6" font-family="Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1.1">ONE SUBJECT · THREE DEPTHS · ONE CLEAR BEAT</text>
      <text x="811" y="338" fill="#FFF6E6" font-family="Arial, sans-serif" font-size="14" font-weight="800">THE COLOUR REMEMBERS THE PHOTO.</text>
    </g>
  </g>
</svg>
